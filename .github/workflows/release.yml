name: Release

on:
  workflow_dispatch:
    inputs:
      first_release:
        description: "First release (tag 0.1.0 without bumping to 0.2.0)"
        required: true
        default: true
        type: boolean
      bump:
        description: "Release bump level (used if first_release is false)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Simulate release (no tags or commits)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Cutver Release Orchestration
    runs-on: ubuntu-latest

    steps:
      - name: Generate release bot token
        id: release-token
        if: (env.CLIENT_ID != '' || env.APP_ID != '') && env.PRIVATE_KEY != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CUTVER_CLIENT_ID || secrets.CUTVER_APP_ID }}
          private-key: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
        env:
          CLIENT_ID: ${{ secrets.CUTVER_CLIENT_ID }}
          APP_ID: ${{ secrets.CUTVER_APP_ID }}
          PRIVATE_KEY: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup Git bot credentials
        run: |
          git config --global user.name "cutver-release[bot]"
          git config --global user.email "${{ steps.release-token.outputs.app-slug || 'cutver-release' }}[bot]@users.noreply.github.com"

      - name: Setup Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"

      - name: Install Cutver CLI (plugin-enabled)
        uses: cutver/setup@v1
        with:
          plugins: "true"

      # Fetches the pinned github-publish WASM artifact into the plugin cache and
      # verifies its digest. Drivers load eagerly, so this must happen before any
      # other cutver invocation.
      - name: Restore pinned Cutver plugins
        run: cutver plugin restore

      - name: Execute Cutver Release
        uses: cutver/release@v1
        id: cutver
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          command: release
          bump: ${{ github.event.inputs.bump || 'auto' }}
          first-release: ${{ github.event.inputs.first_release }}
          dry-run: ${{ github.event.inputs.dry_run || false }}
          template: ".github/templates/cutver/RELEASE.md"

      # The github-publish plugin creates the release as a DRAFT after the tag
      # push. This step only promotes that draft; it never creates a release.
      - name: Publish the draft release
        if: steps.cutver.outputs.released == 'true' && github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.cutver.outputs.tag }}
        run: |
          set -euo pipefail

          error() {
            echo "::error::$*"
            exit 1
          }

          if ! state=$(gh release view "$TAG" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>&1); then
            error "Could not read release $TAG: $state — a missing release means the github-publish plugin never created its draft; check the Execute Cutver Release logs."
          fi

          case "$state" in
            published)
              echo "Release $TAG is already published; nothing to do."
              exit 0
              ;;
            draft)
              ;;
            *)
              error "Release $TAG is in an unexpected state: '$state'."
              ;;
          esac

          gh release edit "$TAG" --draft=false --title "Release $TAG"

          if ! state=$(gh release view "$TAG" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>&1); then
            error "Could not re-read release $TAG after promotion: $state"
          fi

          if [ "$state" = "draft" ]; then
            error "Release $TAG is still a draft after gh release edit."
          fi

          echo "Promoted $TAG to a published release."

      - name: Report Release Summary
        if: steps.cutver.outputs.released == 'true'
        run: |
          echo "======================================================="
          echo "🚀 Released version: ${{ steps.cutver.outputs.version }}"
          echo "🏷️ Git tag:         ${{ steps.cutver.outputs.tag }}"
          echo "======================================================="
