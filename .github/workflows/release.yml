name: Release

on:
  workflow_dispatch:
    inputs:
      first_release:
        description: "First release (tag 0.1.0 without bumping to 0.2.0)"
        required: true
        default: true
        type: boolean
      bump:
        description: "Release bump level (used if first_release is false)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Simulate release (no tags or commits)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Cutver Release Orchestration
    runs-on: ubuntu-latest

    steps:
      - name: Generate release bot token
        id: release-token
        if: (env.CLIENT_ID != '' || env.APP_ID != '') && env.PRIVATE_KEY != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CUTVER_CLIENT_ID || secrets.CUTVER_APP_ID }}
          private-key: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
        env:
          CLIENT_ID: ${{ secrets.CUTVER_CLIENT_ID }}
          APP_ID: ${{ secrets.CUTVER_APP_ID }}
          PRIVATE_KEY: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup Git bot credentials
        run: |
          git config --global user.name "cutver-release[bot]"
          git config --global user.email "${{ steps.release-token.outputs.app-slug || 'cutver-release' }}[bot]@users.noreply.github.com"

      - name: Install Cutver CLI
        uses: cutver/setup@v1

      - name: Execute Cutver Release
        uses: cutver/release@v1
        id: cutver
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}
        with:
          command: release
          bump: ${{ github.event.inputs.bump || 'auto' }}
          first-release: ${{ github.event.inputs.first_release }}
          dry-run: ${{ github.event.inputs.dry_run || false }}

      - name: Publish GitHub Release
        if: steps.cutver.outputs.released == 'true' && !github.event.inputs.dry_run
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.cutver.outputs.tag }}" \
            --title "${{ steps.cutver.outputs.tag }}" \
            --notes-file "${{ steps.cutver.outputs.notes-path }}"

      - name: Report Release Summary
        if: steps.cutver.outputs.released == 'true'
        run: |
          echo "======================================================="
          echo "🚀 Released version: ${{ steps.cutver.outputs.version }}"
          echo "🏷️ Git tag:         ${{ steps.cutver.outputs.tag }}"
          echo "======================================================="
