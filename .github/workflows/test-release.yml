name: Test Release (Dry Run)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump level to simulate"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      first_release:
        description: "Simulate first release (keep current version 0.1.0)"
        required: false
        default: true
        type: boolean
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  test-release:
    name: Simulate Cutver Release Preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # cutver.toml pins `require_branch = "main"`, but on pull_request events
      # actions/checkout leaves a detached HEAD, where `git symbolic-ref --short HEAD`
      # exits 128 and cutver's git guard aborts the simulation. Re-creating a local
      # `main` at the checked-out commit lets this preflight run for a PR too: the
      # name is only what the guard reads, while the tree stays the candidate's.
      # Nothing here can release anything — the bump below is a dry run.
      - name: Name the checked-out commit main for the cutver branch guard
        run: git switch -C main

      - name: Install Cutver CLI (plugin-enabled)
        uses: cutver/setup@v1
        with:
          plugins: "true"

      # The plugin manager is built eagerly, so restore the pinned artifact before
      # any cutver command — including `cutver doctor`.
      - name: Restore pinned Cutver plugins
        run: cutver plugin restore

      # No Typst setup here on purpose: preflight never runs under --dry-run, so a
      # compiler install would be dead weight in this simulation workflow.
      - name: Validate Manifest Health & Changelog
        run: cutver doctor --check-changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Execute Cutver Bump Simulation
        uses: cutver/release@v1
        id: cutver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          command: bump
          bump: ${{ github.event.inputs.bump || 'auto' }}
          first-release: ${{ github.event.inputs.first_release || false }}
          dry-run: true

      - name: Report Simulation Output
        run: |
          echo "======================================================="
          echo "✔ Cutver release simulation completed successfully!"
          echo "ℹ Simulated version: ${{ steps.cutver.outputs.version }}"
          echo "ℹ Simulated tag:     ${{ steps.cutver.outputs.tag }}"
          echo "======================================================="
