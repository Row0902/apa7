name: Test Release (Dry Run)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump level to simulate"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      first_release:
        description: "Simulate first release (keep current version 0.1.0)"
        required: false
        default: true
        type: boolean
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  test-release:
    name: Simulate Cutver Release Preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # cutver.toml pins `require_branch = "main"`, but on pull_request events
      # actions/checkout leaves a detached HEAD, where `git symbolic-ref --short HEAD`
      # exits 128 and cutver's git guard aborts the simulation. Re-creating a local
      # `main` at the checked-out commit lets this preflight run for a PR too: the
      # name is only what the guard reads, while the tree stays the candidate's.
      # Nothing here can release anything — the bump below is a dry run.
      - name: Name the checked-out commit main for the cutver branch guard
        run: git switch -C main

      - name: Install Cutver CLI (plugin-enabled)
        uses: cutver/setup@v1
        with:
          plugins: ${{ github.event_name == 'workflow_dispatch' }}

      # The plugin manager is built eagerly, so restore the pinned artifact before
      # any cutver command — including `cutver doctor`.
      - name: Restore pinned Cutver plugins
        if: github.event_name == 'workflow_dispatch'
        run: cutver plugin restore

      # A pull request can edit cutver.toml, so the preflight runs on a copy built by
      # KEEPING only the tables the simulation needs. Blacklisting [plugins.*] is not
      # enough: TOML accepts whitespace inside a header and dotted keys outside one.
      - name: Build a plugin-free preflight config
        run: |
          set -euo pipefail
          awk '
            /^[[:space:]]*\[/ { keep = ($0 ~ /^[[:space:]]*\[\[?[[:space:]]*(manifest|changelog|git|preflight)([[:space:]]|\]|\.)/); if (keep) print; next }
            keep { print }
          ' cutver.toml > cutver.ci.toml
          if grep -qi plugin cutver.ci.toml; then
            echo "::error::cutver.ci.toml still mentions a plugin after whitelisting; refusing to run."
            exit 1
          fi

      # No Typst setup here on purpose: a PR run loads no plugin at all, and the
      # bump simulation is a dry run, so a compiler install would be dead weight.
      - name: Validate Manifest Health & Changelog
        run: cutver --config cutver.ci.toml doctor --check-changelog
        env:
          # A pull request run loads no plugin, so it is given no token.
          GITHUB_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.GITHUB_TOKEN || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Execute Cutver Bump Simulation
        uses: cutver/release@v1
        id: cutver
        env:
          # A pull request run loads no plugin, so it is given no token.
          GITHUB_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.GITHUB_TOKEN || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          config: cutver.ci.toml
          command: bump
          bump: ${{ github.event.inputs.bump || 'auto' }}
          first-release: ${{ github.event.inputs.first_release || false }}
          dry-run: true

      - name: Report Simulation Output
        run: |
          echo "======================================================="
          echo "✔ Cutver release simulation completed successfully!"
          echo "ℹ Simulated version: ${{ steps.cutver.outputs.version }}"
          echo "ℹ Simulated tag:     ${{ steps.cutver.outputs.tag }}"
          echo "======================================================="
